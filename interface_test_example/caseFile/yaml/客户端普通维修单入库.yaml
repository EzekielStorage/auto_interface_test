config:
  skip: false
  baseurl: ${BMS_URL}
  timeout: 30.0
  verify_ssl: false
  headers:
    Accept: application/json, text/javascript, */*; q=0.01
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Connection: keep-alive
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
      like Gecko) Chrome/83.0.4103.116 Safari/537.36
    cookies: i18n_redirected=en; _ga=GA1.1.2035449644.1756374279; factoryToken=Bearer%20xxxxx
    X-Requested-With: XMLHttpRequest
    authorization: ${BMS_TOKEN}
variable:
  none: none
tests:
  create_normal_repair_order:
    description: 新建普通维修订单
    method: post
    route: /api/warehouse/addDraftBackOrder
    RequestData:
      json:
        warehouse_id: 1
        warehouse_name: USCA001
        country_id: ''
        name: 2025-10-28-002
        address: 123 William St
        addressLine1: 123 William St
        addressLine2: ''
        country_code: US
        area_code: US
        zipcode: 10038-3804
        city: New York
        phone: '+16507268043'
        state_code: NY
        after_sale_type: 2
        parcels:
          - packageNum: 1
            length: 0.029
            width: 0.029
            height: 0.029
            distanceUnit: in
            weight: 45
            massUnit: lb
            packageCode: your_package
            sku: RP_ModelY||毛豆Y||7||0.029||0.029||0.029||45
            extra:
              insurance: 0
              isCod: false
              codAmount: 0
              paymentMethod: any
              dryIceWeight: 0
        order_info:
          - box_num: 0
            sku: RP_ModelY
            sku_name: 毛豆Y
            sku_type_id: '7'
            num: 1
            user_note: ''
            after_sale_type: 2
        buy_way: AliExpress
        buy_no: xxx212
        buy_time: ''
        safe_time: ''
        email: chester.jensen@gmail.com
        user_note: rq
        old_sn: ''
    Validate:
      expectCode: 200
    Extract:
      - order_no: $.data.order_no
      - global_order_no: $.data.global_order_no
  purchase_return_label:
    description: 估价购买回邮单
    method: put
    route: /api/warehouse/submitBackOrder
    RequestData:
      json:
        service_code: fedex_ground
        service_name: FedEx Ground®
        return_service_id: 2620
        order_no: ${order_no}
        isValid: true
    Validate:
      expectCode: 200
      resultCheckJsonpath:
        - $.code:ok
        - $.code:200
