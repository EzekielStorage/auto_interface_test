    description: 通用工程师查询RMA维修单
    method: GET
    route: /api/engineer/afterSale/orderList?page=1&type_arr=1%2C2&express_no=${express_no}&limit=10&timestamp=1765878964012
    Validate:
      expectCode: 200
    Extract:
      - rma_order_id: $.[0].sale_info.rma_order_id
      - order_id: $.[0].id
  add_engineer_order:
    description: 通用工程师领单
    method: POST
    route: /api/warehouse/afterSale/addEngineerOrder
