config:
  skip: false
  baseurl: ${BMS_URL}
  timeout: 120.0
  verify_ssl: false
  headers:
    Accept: application/json, text/javascript, */*; q=0.01
    Accept-Encoding: gzip, deflate, br
    Accept-Language: zh-CN,zh;q=0.9
    Connection: keep-alive
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
      like Gecko) Chrome/83.0.4103.116 Safari/537.36
    cookies: i18n_redirected=en; _ga=GA1.1.2035449644.1756374279; factoryToken=Bearer%20xxxxx
    X-Requested-With: XMLHttpRequest
    authorization: ${BMS_TOKEN_SERVICE}
variable:
  none: none
tests:
  get_in_order_detail:
    description: 查询入库订单信息
    method: get
    route: /api/warehouse/warehouse/orderList?page=1&limit=10&keyword=${global_order_no}&status=1,2,3,4,5&timestamp=1763455053769
    Validate:
      expectCode: 200
    ResultData: resultData
    Extract:
      - express_no: $.data[0].express_no
      - inbound_order_id: $.data[0].id
  operate_inbound:
    description: 入库操作
    method: PUT
    route: /api/warehouse/warehouse/editOrderInfo/${inbound_order_id}
    RequestData:
      json: ${resultData}
    Validate:
      expectCode: 200